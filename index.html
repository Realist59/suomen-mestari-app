<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background-color: #72c3e0; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; position: relative; }
        .screen.active { display: flex; }
        
        /* --- ЭКРАН 1: Меню --- */
        .search-container { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; margin-top: -20px; z-index: 10; }
        .search-input { width: 100%; padding: 12px 40px; border: none; border-radius: 50px; font-size: 16px; outline: none; text-align: center; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; }
        .menu-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; z-index: 10; }
        .color-blue { color: #275d9d; }
        .color-white { color: #ffffff; }
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; z-index: 10; }
        .btn-chapter, .btn-answers { background-color: #275d9d; color: #ffffff; border: none; padding: 14px 5px; font-size: 15px; font-weight: 600; border-radius: 50px; cursor: pointer; text-align: center; }
        .answers-wrapper { display: flex; justify-content: center; width: 100%; max-width: 340px; z-index: 10; }
        .btn-answers { width: calc(33.333% - 7px); }

        /* --- ЭКРАН 2: PDF с блюром --- */
        #lesson-view { 
            background-color: #000; 
            padding: 0; 
            position: relative;
            overflow: hidden;
        }

        /* Кнопка Назад поверх всего */
        .btn-back-fixed {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* Размытый фон */
        .pdf-blur-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 1;
            opacity: 0.6;
            filter: blur(25px);
            pointer-events: none; /* Чтобы нельзя было скроллить фон */
        }

        .pdf-blur-bg iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Четкий PDF по центру */
        .pdf-main {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 10px 10px 10px; /* Отступы для кнопки назад */
        }

        .pdf-main iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Введите ваш запрос">
        </div>
        <div class="menu-title">
            <span class="color-blue">Suomen</span> <span class="color-white">Mestari</span> <span class="color-blue">1</span>
        </div>
        <div class="buttons-grid" id="chaptersGrid"></div>
        <div class="answers-wrapper">
            <button class="btn-answers" onclick="alert('В разработке')">Vastaukset</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Просмотр PDF -->
    <div id="lesson-view" class="screen">
        <button class="btn-back-fixed" onclick="goBack()">← Назад</button>
        
        <!-- Размытый фон -->
        <div class="pdf-blur-bg" id="pdfBlur"></div>
        
        <!-- Четкая страница по центру -->
        <div class="pdf-main" id="pdfMain"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Здесь укажи имя своего PDF-файла
        const pdfFile = "kappale1.pdf";

        // Генерация кнопок
        const grid = document.getElementById('chaptersGrid');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-chapter';
            btn.innerText = `Kappale ${i}`;
            btn.onclick = () => {
                if (i !== 1) { alert("Пока только глава 1"); return; }
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('lesson-view').classList.add('active');
                
                // Вставляем размытый фон (тот же PDF)
                document.getElementById('pdfBlur').innerHTML = `<iframe src="${pdfFile}#toolbar=0&navpanes=0&scrollbar=0"></iframe>`;
                
                // Вставляем четкий PDF по центру (с отключенными панелями для чистоты)
                document.getElementById('pdfMain').innerHTML = `<iframe src="${pdfFile}#toolbar=0&navpanes=0&scrollbar=0"></iframe>`;
            };
            grid.appendChild(btn);
        }

        function goBack() {
            document.getElementById('lesson-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            
            // Очищаем контейнеры, чтобы PDF перестал грузиться
            document.getElementById('pdfBlur').innerHTML = '';
            document.getElementById('pdfMain').innerHTML = '';
        }
    </script>
</body>
</html>
