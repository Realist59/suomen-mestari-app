<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Цвет фона вокруг картинки, если пропорции экрана отличаются */
            background-color: #5ab1df; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('front-page.jpg');
            /* Картинка теперь целиком помещается на экране без обрезки */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            height: 100%;
            padding-bottom: 40px;
        }
        .btn-continue {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 44px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-continue:active {
            transform: scale(0.96);
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="container">
        <button class="btn-continue" onclick="onContinueClick()">Продолжить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onContinueClick() {
            alert("Поехали учить финский!");
        }
    </script>
</body>
</html>
