<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: #72c3e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Поле поиска --- */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 340px;
            margin-bottom: 10px; /* Такой же отступ, как между кнопками в сетке */
        }

        .search-input {
            width: 100%;
            padding: 14px 14px 14px 45px; /* Слева отступ больше для иконки */
            border: none;
            border-radius: 50px; /* Форма капсулы, как у кнопок */
            font-size: 15px;
            font-family: inherit;
            color: #333;
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .search-input::placeholder {
            color: #999;
        }

        /* Иконка лупы */
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #999;
            pointer-events: none; /* Чтобы клик проходил сквозь иконку в поле ввода */
        }

        /* --- Заголовок --- */
        .menu-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 35px; /* Чуть больше отступ от поиска до заголовка */
            letter-spacing: 0.5px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .color-blue {
            color: #275d9d;
        }
        .color-white {
            color: #ffffff;
        }

        /* --- Кнопки --- */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 10px;
        }

        .btn-chapter, .btn-answers {
            background-color: #275d9d; 
            color: #ffffff;
            border: none;
            padding: 14px 5px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        .answers-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 340px;
        }

        .btn-answers {
            width: calc(33.333% - 7px);
        }

        .btn-chapter:active, .btn-answers:active {
            transform: scale(0.96);
            background-color: #1e4a7a; 
        }
    </style>
</head>
<body>

    <!-- Поле поиска -->
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Поиск...">
    </div>

    <!-- Заголовок -->
    <div class="menu-title">
        <span class="color-blue">Suomen</span> 
        <span class="color-white">Mestari</span> 
        <span class="color-blue">1</span>
    </div>
    
    <!-- Сетка кнопок -->
    <div class="buttons-grid">
        <button class="btn-chapter" onclick="openChapter(1)">Kappale 1</button>
        <button class="btn-chapter" onclick="openChapter(2)">Kappale 2</button>
        <button class="btn-chapter" onclick="openChapter(3)">Kappale 3</button>
        
        <button class="btn-chapter" onclick="openChapter(4)">Kappale 4</button>
        <button class="btn-chapter" onclick="openChapter(5)">Kappale 5</button>
        <button class="btn-chapter" onclick="openChapter(6)">Kappale 6</button>
        
        <button class="btn-chapter" onclick="openChapter(7)">Kappale 7</button>
        <button class="btn-chapter" onclick="openChapter(8)">Kappale 8</button>
        <button class="btn-chapter" onclick="openChapter(9)">Kappale 9</button>
    </div>

    <div class="answers-wrapper">
        <button class="btn-answers" onclick="openAnswers()">Vastaukset</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openChapter(num) {
            alert("Открываем Kappale " + num);
        }

        function openAnswers() {
            alert("Открываем ответы (Vastaukset)");
        }
    </script>
</body>
</html>
