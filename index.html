<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: #72c3e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .menu-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            letter-spacing: 0.5px;
        }

        /* Сетка для кнопок */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колонки */
            gap: 10px;
            width: 100%;
            max-width: 340px;
        }

        .btn-chapter {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 5px; /* Уменьшил горизонтальные отступы, чтобы текст влезал */
            font-size: 15px; /* Чуть уменьшил шрифт для компактности */
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            white-space: nowrap; /* Запрещаем перенос текста */
        }

        .btn-chapter:active {
            transform: scale(0.96);
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="menu-title">Suomen Mestari 1</div>
    
    <div class="buttons-grid">
        <button class="btn-chapter" onclick="openChapter(1)">Kappale 1</button>
        <button class="btn-chapter" onclick="openChapter(2)">Kappale 2</button>
        <button class="btn-chapter" onclick="openChapter(3)">Kappale 3</button>
        
        <button class="btn-chapter" onclick="openChapter(4)">Kappale 4</button>
        <button class="btn-chapter" onclick="openChapter(5)">Kappale 5</button>
        <button class="btn-chapter" onclick="openChapter(6)">Kappale 6</button>
        
        <button class="btn-chapter" onclick="openChapter(7)">Kappale 7</button>
        <button class="btn-chapter" onclick="openChapter(8)">Kappale 8</button>
        <button class="btn-chapter" onclick="openChapter(9)">Kappale 9</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function openChapter(num) {
            alert("Открываем Kappale " + num);
        }
    </script>
</body>
</html>
