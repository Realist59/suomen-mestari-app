<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем библиотеку PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background-color: #72c3e0; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; }
        .screen.active { display: flex; }
        
        /* --- Меню --- */
        .search-container { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; margin-top: -20px; }
        .search-input { width: 100%; padding: 12px 40px; border: none; border-radius: 50px; font-size: 16px; outline: none; text-align: center; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; }
        .menu-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
        .color-blue { color: #275d9d; }
        .color-white { color: #ffffff; }
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .btn-chapter, .btn-answers { background-color: #275d9d; color: #ffffff; border: none; padding: 14px 5px; font-size: 15px; font-weight: 600; border-radius: 50px; cursor: pointer; text-align: center; }
        .answers-wrapper { display: flex; justify-content: center; width: 100%; max-width: 340px; }
        .btn-answers { width: calc(33.333% - 7px); }

        /* --- Экран PDF --- */
        #lesson-view { 
            justify-content: flex-start; 
            background-color: #333; /* Темный фон, чтобы белая страница выделялась */
            padding: 0; 
            position: relative; 
            overflow: hidden;
        }
        
        .btn-home {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            width: 45px; height: 45px; border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.6); color: white; border: none;
            font-size: 22px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }

        /* Контейнер для PDF (он будет скроллиться вниз) */
        .pdf-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: auto; /* Позволяем скроллить вниз, если страница длинная */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 10px 10px 10px; /* Отступ сверху для кнопки домика */
        }

        /* Холст, на котором рисуется PDF */
        canvas {
            width: 100%; /* Растягиваем на всю ширину экрана */
            height: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: white;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Введите ваш запрос">
        </div>
        <div class="menu-title">
            <span class="color-blue">Suomen</span> <span class="color-white">Mestari</span> <span class="color-blue">1</span>
        </div>
        <div class="buttons-grid" id="chaptersGrid"></div>
        <div class="answers-wrapper">
            <button class="btn-answers" onclick="alert('В разработке')">Vastaukset</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Просмотр PDF -->
    <div id="lesson-view" class="screen">
        <button class="btn-home" onclick="goBack()">🏠</button>
        
        <div class="pdf-scroll-container" id="pdfContainer">
            <canvas id="pdfCanvas"></canvas>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.disableVerticalSwipes) { tg.disableVerticalSwipes(); }

        // Укажи имя своего PDF файла
        const pdfFile = "kappale1.pdf"; 
        
        // Настройка PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const grid = document.getElementById('chaptersGrid');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-chapter';
            btn.innerText = `Kappale ${i}`;
            btn.onclick = () => {
                if (i !== 1) { alert("Пока только глава 1"); return; }
                
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('lesson-view').classList.add('active');
                
                // Запускаем загрузку и отрисовку PDF
                renderPdf();
            };
            grid.appendChild(btn);
        }

        // Функция для отрисовки PDF на холсте
        async function renderPdf() {
            try {
                // Загружаем документ
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                const pdf = await loadingTask.promise;
                
                // Берем первую страницу
                const page = await pdf.getPage(1);
                
                // Настраиваем масштаб, чтобы влезло по ширине экрана
                const containerWidth = document.getElementById('pdfContainer').clientWidth - 20; // Вычитаем отступы
                const viewport = page.getViewport({ scale: 1 });
                const scale = containerWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale });

                // Настраиваем холст
                const canvas = document.getElementById('pdfCanvas');
                const context = canvas.getContext('2d');
                canvas.height = scaledViewport.height;
                canvas.width = scaledViewport.width;

                // Рисуем страницу
                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;
                
            } catch (error) {
                console.error("Ошибка при загрузке PDF:", error);
                document.getElementById('pdfContainer').innerHTML = "<p style='color:white; text-align:center; padding:20px;'>Ошибка загрузки PDF. Проверьте, что файл называется kappale1.pdf</p>";
            }
        }

        function goBack() {
            document.getElementById('lesson-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            // Очищаем холст
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
