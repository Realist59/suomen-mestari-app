<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Запрещаем пользователю и браузеру масштабировать страницу -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            height: 100vh; 
            background-color: #72c3e0; 
            font-family: sans-serif; 
            overflow: hidden; 
            /* Отключаем оттягивание страницы (резинку) на iOS */
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }

        .screen { 
            display: none; 
            height: 100%; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            width: 100%; 
            /* Запрещаем скролл самого экрана, чтобы не было зума */
            overflow: hidden; 
        }
        .screen.active { display: flex; }
        
        /* --- Меню --- */
        .search-container { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; margin-top: -20px; }
        .search-input { width: 100%; padding: 12px 40px; border: none; border-radius: 50px; font-size: 16px; outline: none; text-align: center; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; }
        .menu-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
        .color-blue { color: #275d9d; }
        .color-white { color: #ffffff; }
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .btn-chapter, .btn-answers { background-color: #275d9d; color: #ffffff; border: none; padding: 14px 5px; font-size: 15px; font-weight: 600; border-radius: 50px; cursor: pointer; text-align: center; }
        .answers-wrapper { display: flex; justify-content: center; width: 100%; max-width: 340px; }
        .btn-answers { width: calc(33.333% - 7px); }

        /* --- Экран PDF --- */
        #lesson-view { 
            justify-content: flex-start; 
            background-color: #fff; 
            padding: 0; 
            position: relative; 
            overflow: hidden; /* Скрываем всё, что вылезает */
        }
        
        .btn-home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-home:active { background-color: rgba(0, 0, 0, 0.7); }

        .pdf-container { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; /* Отключаем скролл контейнера */
        }
        
        .pdf-container iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Введите ваш запрос">
        </div>
        <div class="menu-title">
            <span class="color-blue">Suomen</span> <span class="color-white">Mestari</span> <span class="color-blue">1</span>
        </div>
        <div class="buttons-grid" id="chaptersGrid"></div>
        <div class="answers-wrapper">
            <button class="btn-answers" onclick="alert('В разработке')">Vastaukset</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Просмотр PDF -->
    <div id="lesson-view" class="screen">
        <button class="btn-home" onclick="goBack()">🏠</button>
        <div class="pdf-container" id="pdfContainer"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Отключаем свайп-навигацию Telegram (чтобы не закрывалось при свайпе)
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }

        const grid = document.getElementById('chaptersGrid');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-chapter';
            btn.innerText = `Kappale ${i}`;
            btn.onclick = () => {
                if (i !== 1) { alert("Пока только глава 1"); return; }
                
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('lesson-view').classList.add('active');
                
                // Добавил параметры в ссылку, чтобы PDF открывался без лишних панелей и не пытался зуммиться
                document.getElementById('pdfContainer').innerHTML = '<iframe src="kappale1.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=100"></iframe>';
            };
            grid.appendChild(btn);
        }

        function goBack() {
            document.getElementById('lesson-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            document.getElementById('pdfContainer').innerHTML = '';
        }
    </script>
</body>
</html>
