<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Введите ваш запрос">
        </div>

        <div class="menu-title">
            <span class="color-blue">Suomen</span> 
            <span class="color-white">Mestari</span> 
            <span class="color-blue">1</span>
        </div>
        
        <div class="buttons-grid" id="chaptersGrid">
            <!-- Кнопки уроков генерируются через JS -->
        </div>

        <div class="answers-wrapper">
            <button class="btn-answers" onclick="openAnswers()">Vastaukset</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Просмотр урока -->
    <div id="lesson-view" class="screen">
        <div class="lesson-header">
            <button class="btn-back" onclick="goBackToMenu()">← Назад</button>
            <h2 id="lessonTitle">Kappale 1</h2>
            <div style="width: 60px;"></div>
        </div>
        
        <div class="lesson-content" id="lessonContent">
            <!-- Сюда JS вставляет текст -->
        </div>
        
        <div class="lesson-controls">
            <button id="btnPrev" class="btn-nav" onclick="prevPage()">←</button>
            <span id="pageIndicator">1 / 1</span>
            <button id="btnNext" class="btn-nav" onclick="nextPage()">→</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
