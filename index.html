<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем библиотеку PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; background-color: #333; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; padding: 20px; width: 100%; }
        .screen.active { display: flex; }
        
        /* --- Меню --- */
        .search-container { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; margin-top: -20px; }
        .search-input { width: 100%; padding: 12px 40px; border: none; border-radius: 50px; font-size: 16px; outline: none; text-align: center; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #888; }
        .menu-title { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
        .color-blue { color: #275d9d; }
        .color-white { color: #ffffff; }
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; margin-bottom: 10px; }
        .btn-chapter, .btn-answers { background-color: #275d9d; color: #ffffff; border: none; padding: 14px 5px; font-size: 15px; font-weight: 600; border-radius: 50px; cursor: pointer; text-align: center; }
        .answers-wrapper { display: flex; justify-content: center; width: 100%; max-width: 340px; }
        .btn-answers { width: calc(33.333% - 7px); }

        /* --- Экран PDF --- */
        #lesson-view { 
            justify-content: flex-start; 
            background-color: #333; 
            padding: 0; 
            position: relative; 
            overflow: hidden;
        }
        
        /* Общие стили для круглых кнопок */
        .nav-btn {
            position: absolute;
            z-index: 100;
            width: 40px; /* Чуть уменьшил, чтобы меньше закрывали текст */
            height: 40px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: opacity 0.2s;
            /* Тень для лучшей видимости на белом фоне */
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .nav-btn:active { background-color: rgba(0, 0, 0, 0.6); }

        .btn-home { top: 15px; left: 15px; }
        .btn-prev { top: 50%; left: 5px; transform: translateY(-50%); }
        .btn-next { top: 50%; right: 5px; transform: translateY(-50%); }

        .btn-prev.disabled {
            opacity: 0;
            pointer-events: none;
        }

        /* Контейнер для PDF - теперь БЕЗ отступов по бокам */
        .pdf-scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0; /* Убрали все отступы */
        }

        canvas {
            width: 100%; /* Страница растягивается на всю ширину экрана */
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="main-menu" class="screen active">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Введите ваш запрос">
        </div>
        <div class="menu-title">
            <span class="color-blue">Suomen</span> <span class="color-white">Mestari</span> <span class="color-blue">1</span>
        </div>
        <div class="buttons-grid" id="chaptersGrid"></div>
        <div class="answers-wrapper">
            <button class="btn-answers" onclick="alert('В разработке')">Vastaukset</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Просмотр PDF -->
    <div id="lesson-view" class="screen">
        
        <button class="nav-btn btn-home" onclick="goBack()">🏠</button>
        <button class="nav-btn btn-prev disabled" id="btnPrev" onclick="changePage(-1)">‹</button>
        <button class="nav-btn btn-next" id="btnNext" onclick="changePage(1)">›</button>
        
        <div class="pdf-scroll-container" id="pdfContainer">
            <canvas id="pdfCanvas"></canvas>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.disableVerticalSwipes) { tg.disableVerticalSwipes(); }

        const pdfFile = "kappale1.pdf"; 
        
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 0;

        const grid = document.getElementById('chaptersGrid');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-chapter';
            btn.innerText = `Kappale ${i}`;
            btn.onclick = () => {
                if (i !== 1) { alert("Пока только глава 1"); return; }
                
                document.getElementById('main-menu').classList.remove('active');
                document.getElementById('lesson-view').classList.add('active');
                
                loadPdf();
            };
            grid.appendChild(btn);
        }

        async function loadPdf() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                currentPageNum = 1;
                
                renderPage(currentPageNum);
            } catch (error) {
                console.error("Ошибка загрузки PDF:", error);
                alert("Не удалось загрузить PDF.");
            }
        }

        async function renderPage(num) {
            if (!pdfDoc) return;
            
            const page = await pdfDoc.getPage(num);
            const container = document.getElementById('pdfContainer');
            
            // Теперь ширина контейнера = ширине экрана (без отступов)
            const containerWidth = container.clientWidth; 
            const viewport = page.getViewport({ scale: 1 });
            
            // Вычисляем масштаб так, чтобы страница заполнила всю ширину
            const scale = containerWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale: scale });

            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            
            // Увеличиваем разрешение холста для лучшей четкости (умножаем на window.devicePixelRatio)
            const outputScale = window.devicePixelRatio || 1;
            canvas.width = Math.floor(scaledViewport.width * outputScale);
            canvas.height = Math.floor(scaledViewport.height * outputScale);
            
            // Задаем стили для отображения
            canvas.style.width = Math.floor(scaledViewport.width) + "px";
            canvas.style.height = Math.floor(scaledViewport.height) + "px";

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

            const renderContext = {
                canvasContext: context,
                transform: transform,
                viewport: scaledViewport
            };
            
            await page.render(renderContext).promise;

            const btnPrev = document.getElementById('btnPrev');
            if (num === 1) {
                btnPrev.classList.add('disabled');
            } else {
                btnPrev.classList.remove('disabled');
            }
            
            container.scrollTop = 0;
        }

        function changePage(direction) {
            if (!pdfDoc) return;
            const newPage = currentPageNum + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPageNum = newPage;
                renderPage(currentPageNum);
            }
        }

        function goBack() {
            document.getElementById('lesson-view').classList.remove('active');
            document.getElementById('main-menu').classList.add('active');
            
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
            pdfDoc = null;
        }
    </script>
</body>
</html>
