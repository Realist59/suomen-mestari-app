<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Suomen Mestari 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background: #5ab1df;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
            overflow: hidden;
        }

        /* Один элемент: размытый фон + чёткая обложка поверх через ::before */
        .cover {
            position: fixed;
            inset: 0;
            background: url('front-page.jpg') center / contain no-repeat;
            z-index: 1;
        }
        .cover::before {
            content: "";
            position: absolute;
            inset: -20px;               /* прячем светлые края блюра */
            background: url('front-page.jpg') center / cover no-repeat;
            filter: blur(25px);
            z-index: -1;
        }

        .btn-continue {
            position: relative;
            z-index: 10;
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 14px 44px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-continue:active {
            transform: scale(0.96);
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="cover"></div>
    <button class="btn-continue" onclick="onContinueClick()">Продолжить</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onContinueClick() {
            alert("Поехали учить финский!");
        }
    </script>
</body>
</html>
